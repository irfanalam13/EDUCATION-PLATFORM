name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (saves minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; individual jobs widen scope only where needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 0. Change detection — only run the jobs whose files actually changed. Keeps
  #    PRs fast; a change to this workflow re-runs everything.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common: &common
              - '.github/workflows/ci.yml'
            backend:
              - *common
              - 'backend/**'
            web:
              - *common
              - 'frontend_w/**'
            mobile:
              - *common
              - 'mobile/**'
            docker:
              - *common
              - 'backend/**'
              - 'frontend_w/**'
              - '**/Dockerfile'

  # ---------------------------------------------------------------------------
  # 1. Backend lint + static analysis (fast, no services).
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend · lint + SAST
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check (advisory)
        run: ruff format --check .
        continue-on-error: true
      - name: Bandit security scan (advisory)
        run: bandit -r apps config -ll -q
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # 2. Backend tests against REAL Postgres + Redis (production parity) with
  #    coverage. This is the big upgrade over the old sqlite-only run.
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend · test (Postgres + Redis)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "True"
      SECRET_KEY: ci-only-secret-not-used-anywhere-real-000000
      USE_POSTGRES: "True"
      USE_REDIS: "True"
      USE_CELERY: "False"          # tasks run eagerly in-process during tests
      DB_NAME: edu_platform
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edu_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: |
          coverage run manage.py test apps --verbosity=2
          coverage xml
      - name: Coverage report → job summary
        if: always()
        run: |
          {
            echo "### Backend test coverage"
            echo '```'
            coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Web app — typecheck + lint + production build.
  # ---------------------------------------------------------------------------
  web:
    name: Web · typecheck + lint + build
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_w
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend_w/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8000

  # ---------------------------------------------------------------------------
  # 4. Mobile (Expo) — typecheck. Advisory for now: some declared-dep typings
  #    are still being reconciled (see DEPLOYMENT.md launch blocker #2).
  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile · typecheck
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck (advisory)
        run: npm run typecheck
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # 5. Docker images build + SBOM + image vulnerability scan (SARIF → Security).
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker · build + SBOM + scan
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write     # upload Trivy SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          # Context is backend/ — the Dockerfile's COPY paths are relative to it.
          context: ./backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: edu-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend_w
          file: frontend_w/Dockerfile
          push: false
          load: true
          tags: edu-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (backend image)
        uses: anchore/sbom-action@v0
        with:
          image: edu-backend:ci
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.spdx.json
          if-no-files-found: ignore

      - name: Trivy scan (backend image → SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: edu-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  # ---------------------------------------------------------------------------
  # 6. Secret scanning — fails the build if a credential is committed.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 7. Dependency vulnerability audit (non-blocking).
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependency audit (advisory)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt || true

  # ---------------------------------------------------------------------------
  # 8. Single required status check. Branch protection can require just this one
  #    job; it passes only if every required job succeeded or was legitimately
  #    skipped (e.g. mobile-only change skips the backend jobs).
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - backend-lint
      - backend-test
      - web
      - mobile
      - docker-build
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Required job results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "All required jobs passed (or were skipped)."
