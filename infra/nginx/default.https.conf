# HTTPS reverse proxy. Use this AFTER a Let's Encrypt cert exists for your domain:
#   1. Edit server_name + ssl_certificate paths to your real domain.
#   2. Issue the cert once (see DEPLOYMENT.md "First-time HTTPS").
#   3. Mount this file instead of default.conf, then: docker compose restart nginx
#
# Replace yourdomain.com everywhere below.

upstream django_upstream { server backend:8000; }
upstream next_upstream   { server web:3000;     }

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain text/css text/xml application/json application/javascript
  application/xml application/rss+xml application/atom+xml image/svg+xml
  font/ttf font/otf application/font-woff application/font-woff2;

# ---------- HTTP: ACME challenge + redirect to HTTPS ----------
server {
  listen 80;
  server_name yourdomain.com www.yourdomain.com;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS: main reverse proxy ----------
server {
  listen 443 ssl;
  http2 on;
  server_name yourdomain.com www.yourdomain.com;

  client_max_body_size 50M;

  ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-XSS-Protection "0" always;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location /static/ {
    alias /app/staticfiles/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  location /media/ {
    alias /app/media/;
    access_log off;
    expires 7d;
  }

  location ~ ^/(api|admin|healthz)/ {
    proxy_pass http://django_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://next_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
