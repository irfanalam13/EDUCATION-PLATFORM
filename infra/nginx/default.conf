# HTTP-first reverse proxy. This config BOOTS WITHOUT TLS CERTS so
# `docker compose up` works on a fresh host. After issuing a Let's Encrypt cert
# (see DEPLOYMENT.md), swap in infra/nginx/default.https.conf for HTTPS + HSTS.

upstream django_upstream { server backend:8000; }
upstream next_upstream   { server web:3000;     }

# Gzip for text assets (images/video are already compressed).
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain text/css text/xml application/json application/javascript
  application/xml application/rss+xml application/atom+xml image/svg+xml
  font/ttf font/otf application/font-woff application/font-woff2;

server {
  listen 80;
  server_name _;

  client_max_body_size 50M;

  # Security headers (HSTS is added only in the HTTPS config).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-XSS-Protection "0" always;

  # ACME HTTP-01 challenge for certbot.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # --- Static & media served straight from the shared volumes (no app hop) ---
  location /static/ {
    alias /app/staticfiles/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  location /media/ {
    alias /app/media/;
    access_log off;
    expires 7d;
  }

  # --- Django (API, admin, schema/docs, healthz) ---
  location ~ ^/(api|admin|healthz)/ {
    proxy_pass http://django_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # --- Next.js (everything else) ---
  location / {
    proxy_pass http://next_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
